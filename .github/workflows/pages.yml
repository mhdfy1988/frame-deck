name: Browser Pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'browser/**'
      - 'web/**'
      - 'scripts/*browser*.mjs'
      - 'package*.json'
      - 'LICENSE'
      - 'tests/browser-static.mjs'
      - 'tests/web/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:browser-format
      - run: npm test
      - run: node scripts/prepare-browser-sources.mjs
      - run: npm run build:browser
        env:
          FRAMEDECK_RELEASE: '1'
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: output/browser-site/frame-deck
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
